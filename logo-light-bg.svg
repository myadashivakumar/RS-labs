<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" role="img" aria-label="RS Labs">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#0a3ea8"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18c5b3"/><stop offset="1" stop-color="#0b8f8a"/>
    </linearGradient>
  </defs>
  <!-- Integration network mark -->
  <g transform="translate(58 60)" stroke-width="5" stroke-linecap="round">
