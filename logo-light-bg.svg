  <text x="124" y="66" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="3" fill="#0b1f3a">RS<tspan fill="#2f6bff" dx="8">LABS</tspan></text>
  <text x="126" y="92" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="3.4" fill="#0b1f3a" opacity=".6">FROM IDEA TO ENTERPRISE</text>
