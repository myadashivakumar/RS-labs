<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RS Labs | Coming Soon</title>
  <meta name="description" content="RS Labs — from idea to enterprise. Something new is on the way.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%22-50 -50 100 100%22%3E%3Cg stroke-width=%227%22 stroke-linecap=%22round%22%3E%3Cpath d=%22M0 -40 L35 -20 L35 20 L0 40 L-35 20 L-35 -20Z%22 fill=%22none%22 stroke=%22%232f6bff%22/%3E%3Ccircle r=%2214%22 fill=%22%2318c5b3%22/%3E%3Ccircle cy=%22-40%22 r=%229%22 fill=%22%232f6bff%22/%3E%3Ccircle cx=%2235%22 cy=%2220%22 r=%229%22 fill=%22%232f6bff%22/%3E%3Ccircle cx=%22-35%22 cy=%2220%22 r=%229%22 fill=%22%232f6bff%22/%3E%3C/g%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0a1628;
      --fg: #f2f5fa;
      --muted: #9aa8c0;
      --accent1: #2f6bff;
      --accent2: #18c5b3;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: grid;
      place-items: center;
      padding: 24px 16px;
      overflow: hidden;
      position: relative;
    }

    /* Background: soft glows, live network canvas, and a veil that keeps text readable */
    .glow {
      position: fixed;
      width: 60vmax; height: 60vmax;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .22;
      z-index: 0;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .glow.a { background: var(--accent1); top: -25vmax; left: -20vmax; }
    .glow.b { background: var(--accent2); bottom: -25vmax; right: -20vmax; animation-delay: -9s; }
    @keyframes drift { to { transform: translate(8vmax, 6vmax) scale(1.1); } }
    #net { position: fixed; inset: 0; z-index: 0; display: block; }
    .veil {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(ellipse 55% 45% at center, rgba(10,22,40,.85) 0%, rgba(10,22,40,.4) 60%, transparent 100%);
    }

    main { position: relative; z-index: 1; text-align: center; max-width: 680px; }

    /* Logo build-up */
    .logo { display: block; width: min(400px, 86vw); height: auto; margin: 0 auto 36px; overflow: visible; }
    .logo .hex { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1.1s ease-out .2s forwards; }
    .logo .spokes { opacity: 0; animation: fadeIn .5s ease 1.1s forwards; }
    .logo .node { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: pop .45s cubic-bezier(.3,1.7,.6,1) forwards; }
    .logo .n1 { animation-delay: .55s; }
    .logo .n2 { animation-delay: .8s; }
    .logo .n3 { animation-delay: 1.05s; }
    .logo .core { animation: pop .5s cubic-bezier(.3,1.7,.6,1) 1.3s forwards, beat 2.6s ease-in-out 2.2s infinite; }
    .logo .halo { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ripple 2.6s ease-out 2.2s infinite; }
    .logo .word, .logo .tag { opacity: 0; animation: slideIn .7s ease-out forwards; }
    .logo .word { animation-delay: 1.45s; }
    .logo .tag { animation-name: slideInDim; animation-delay: 1.8s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { to { opacity: .35; } }
    @keyframes pop { to { transform: scale(1); } }
    @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @keyframes ripple { 0% { opacity: .6; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
    @keyframes slideInDim { from { opacity: 0; transform: translateX(-14px); } to { opacity: .6; transform: none; } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      font-size: .8rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 28px;
      background: rgba(10,22,40,.5);
      opacity: 0;
      animation: fadeUp .6s ease 1.9s forwards;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* Typing headline + rotating line */
    h1 {
      font-size: clamp(2.6rem, 9vw, 5rem);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -.02em;
      min-height: 1.1em;
    }
    h1 .typed {
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .rotator {
      margin-top: 20px;
      font-size: clamp(1rem, 2.6vw, 1.25rem);
      line-height: 1.6;
      color: var(--muted);
      min-height: 1.6em;
    }
    .caret {
      display: inline-block;
      width: .08em; height: .95em;
      margin-left: .06em;
      vertical-align: -.1em;
      background: var(--accent2);
      animation: blink 1s steps(1) infinite;
    }
    .rotator .caret { width: 2px; }
    .caret.off { display: none; }
    @keyframes blink { 50% { opacity: 0; } }

    footer {
      position: fixed; bottom: 18px; left: 0; right: 0;
      text-align: center; font-size: .8rem; color: var(--muted); z-index: 1;
    }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    @media (prefers-reduced-motion: reduce) {
      .glow, .caret, .logo .halo { animation: none; }
      .logo .tag { opacity: .6 !important; }
      .logo *, .badge { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; }
      .logo .spokes { opacity: .35 !important; }
      .logo .halo { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="net" aria-hidden="true"></canvas>
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="veil"></div>

  <main>
    <svg class="logo" viewBox="0 0 420 120" role="img" aria-label="RS Labs — From idea to enterprise">
      <defs>
        <linearGradient id="lb" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#0a3ea8"/>
        </linearGradient>
        <linearGradient id="lt" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#18c5b3"/><stop offset="1" stop-color="#0b8f8a"/>
        </linearGradient>
      </defs>
      <g transform="translate(58 60)" stroke-width="5" stroke-linecap="round">
        <g class="spokes" stroke="#f2f5fa">
          <line x1="0" y1="0" x2="0" y2="-40"/><line x1="0" y1="0" x2="35" y2="20"/><line x1="0" y1="0" x2="-35" y2="20"/>
        </g>
        <path class="hex" pathLength="100" d="M0 -40 L35 -20 L35 20 L0 40 L-35 20 L-35 -20Z" fill="none" stroke="url(#lb)" stroke-linejoin="round"/>
        <circle class="halo" r="13" fill="none" stroke="#18c5b3" stroke-width="2"/>
        <circle class="node core" r="13" fill="url(#lt)" stroke="none"/>
        <circle class="node n1" cy="-40" r="7" fill="url(#lb)" stroke="none"/>
        <circle class="node n2" cx="35" cy="20" r="7" fill="url(#lb)" stroke="none"/>
        <circle class="node n3" cx="-35" cy="20" r="7" fill="url(#lb)" stroke="none"/>
      </g>
      <text class="word" x="124" y="66" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="3" fill="#f2f5fa">RS<tspan fill="#2f6bff" dx="8">LABS</tspan></text>
      <text class="tag" x="126" y="92" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="3.4" fill="#f2f5fa">FROM IDEA TO ENTERPRISE</text>
    </svg>

    <span class="badge">Under construction</span>
    <h1><span class="sr-only">Coming Soon</span><span class="typed" id="headline" aria-hidden="true">Coming Soon</span><span class="caret off" id="hcaret" aria-hidden="true"></span></h1>
    <p class="rotator" aria-live="off"><span id="rot">From idea to enterprise.</span><span class="caret off" id="rcaret" aria-hidden="true"></span></p>
  </main>

  <footer>&copy; <span id="y"></span> RS Labs. All rights reserved.</footer>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    /* ---------- Typing headline, then rotating phrases ---------- */
    (async () => {
      const head = document.getElementById('headline');
      const hcaret = document.getElementById('hcaret');
      const rot = document.getElementById('rot');
      const rcaret = document.getElementById('rcaret');
      const title = 'Coming Soon';
      const phrases = [
        'Building enterprise products.',
        'Integrating connected systems.',
        'Engineering cloud platforms.',
        'Delivering solutions that scale.',
        'From idea to enterprise.',
      ];

      if (reduce) return;                      // keep the static text from the HTML

      head.textContent = ''; rot.textContent = '';
      hcaret.classList.remove('off');

      await sleep(2100);                       // let the logo finish building
      for (const ch of title) { head.textContent += ch; await sleep(95); }
      await sleep(700);
      hcaret.classList.add('off');
      rcaret.classList.remove('off');

      for (let i = 0; ; i = (i + 1) % phrases.length) {
        const p = phrases[i];
        for (let k = 1; k <= p.length; k++) { rot.textContent = p.slice(0, k); await sleep(45); }
        await sleep(1900);
        for (let k = p.length; k >= 0; k--) { rot.textContent = p.slice(0, k); await sleep(22); }
        await sleep(350);
      }
    })();

    /* ---------- Animated network background ---------- */
    (() => {
      const c = document.getElementById('net');
      const ctx = c.getContext('2d');
      const mouse = { x: -1e4, y: -1e4 };
      let W, H, link, pts = [];

      function resize() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        W = innerWidth; H = innerHeight;
        c.width = W * dpr; c.height = H * dpr;
        c.style.width = W + 'px'; c.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        link = W < 640 ? 105 : 140;
        const n = Math.min(120, Math.round(W * H / 12000));
        while (pts.length < n) pts.push({
          x: Math.random() * W, y: Math.random() * H,
          vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35,
          r: 1.2 + Math.random() * 1.8, teal: Math.random() < .22,
        });
        pts.length = n;
      }

      function frame() {
        ctx.clearRect(0, 0, W, H);
        for (const p of pts) {
          if (!reduce) {
            const dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy;
            if (d2 < 120 * 120 && d2 > 1) {     // nodes drift gently away from the cursor
              const f = (1 - Math.sqrt(d2) / 120) * .6;
              p.x += dx / Math.sqrt(d2) * f; p.y += dy / Math.sqrt(d2) * f;
            }
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0 || p.x > W) p.vx *= -1;
            if (p.y < 0 || p.y > H) p.vy *= -1;
          }
        }
        ctx.lineWidth = 1;
        for (let i = 0; i < pts.length; i++) {
          const a = pts[i];
          for (let j = i + 1; j < pts.length; j++) {
            const b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
            if (d < link) {
              ctx.strokeStyle = `rgba(47,107,255,${(1 - d / link) * .4})`;
              ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
            }
          }
          const dm = Math.hypot(a.x - mouse.x, a.y - mouse.y);
          if (dm < 190) {                        // cursor acts as a hub node
            ctx.strokeStyle = `rgba(24,197,179,${(1 - dm / 190) * .7})`;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
          }
        }
        for (const p of pts) {
          ctx.fillStyle = p.teal ? 'rgba(24,197,179,.9)' : 'rgba(110,150,255,.85)';
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        }
        if (!reduce) requestAnimationFrame(frame);
      }

      addEventListener('resize', () => { resize(); if (reduce) frame(); });
      addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
      document.addEventListener('pointerleave', () => { mouse.x = mouse.y = -1e4; });
      addEventListener('touchend', () => { mouse.x = mouse.y = -1e4; });
      resize(); frame();
    })();
  </script>
</body>
</html>
